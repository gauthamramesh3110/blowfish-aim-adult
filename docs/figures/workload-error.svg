<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-label="Cell-level accuracy: the policy is worse at every budget">
<style>:root{--sf:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mut:#898781;--gr:#e1e0d9;--ax:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;}@media (prefers-color-scheme:dark){:root{--sf:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--mut:#898781;--gr:#2c2c2a;--ax:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;}}.t{font:13px system-ui,sans-serif;fill:var(--ink2)}.ti{font:600 15px system-ui,sans-serif;fill:var(--ink)}.sub{font:12px system-ui,sans-serif;fill:var(--mut)}.lb{font:600 12px system-ui,sans-serif}</style>
